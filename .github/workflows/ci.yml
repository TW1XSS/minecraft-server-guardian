name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
